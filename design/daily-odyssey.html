<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ship-receipts &middot; Daily Odyssey</title>
    <style>
        :root {
            --bg: #1d2021;
            --bg1: #282828;
            --bg2: #3c3836;
            --bg3: #504945;
            --fg: #ebdbb2;
            --fg-dim: #665c54;
            --orange: #fe8019;
            --yellow: #fabd2f;
            --aqua: #8ec07c;
            --purple: #d3869b;
            --red: #fb4934;
            --blue: #83a598;
            --green: #b8bb26;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Menlo','Monaco','Courier New',monospace;
            font-size: 12px;
            line-height: 1.4;
            overflow: hidden;
            height: 100vh;
        }

        .shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: var(--bg1);
            border-bottom: 1px solid var(--bg2);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .topbar .left { color: var(--orange); }
        .topbar .center { color: var(--fg-dim); }
        .topbar .right { color: var(--aqua); }
        .topbar .fire { color: var(--red); }
        .topbar .streak-num { color: var(--yellow); font-weight: bold; }

        /* ── MAIN AREA ── */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: 1fr auto;
            overflow: hidden;
            gap: 0;
        }

        /* ── ACTIVITY FEED (left) ── */
        .feed {
            grid-row: 1 / 3;
            border-right: 1px solid var(--bg2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .feed-header {
            background: var(--bg1);
            padding: 6px 12px;
            border-bottom: 1px solid var(--bg2);
            color: var(--fg-dim);
            font-size: 11px;
            flex-shrink: 0;
        }
        .feed-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .feed-body::-webkit-scrollbar { width: 4px; }
        .feed-body::-webkit-scrollbar-track { background: var(--bg); }
        .feed-body::-webkit-scrollbar-thumb { background: var(--bg2); border-radius: 2px; }

        /* ── SIDEBAR PANELS (right) ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            gap: 0;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: var(--bg); }
        .sidebar::-webkit-scrollbar-thumb { background: var(--bg2); border-radius: 2px; }

        .panel {
            border-bottom: 1px solid var(--bg2);
            padding: 8px 10px;
        }
        .panel-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--fg-dim);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-title .icon { color: var(--orange); }

        /* Progress bar */
        .progress-track {
            height: 8px;
            background: var(--bg2);
            border-radius: 2px;
            overflow: hidden;
            margin: 4px 0;
        }
        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-fill.orange { background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow)); }
        .progress-fill.aqua { background: linear-gradient(90deg, var(--blue), var(--aqua), var(--green)); }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 11px;
        }
        .stat-label { color: var(--fg-dim); }
        .stat-value { font-weight: bold; }
        .stat-value.org { color: var(--orange); }
        .stat-value.yel { color: var(--yellow); }
        .stat-value.aqu { color: var(--aqua); }
        .stat-value.grn { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.pur { color: var(--purple); }

        /* Waypoint dots */
        .wp-dots {
            display: flex;
            gap: 6px;
            margin: 4px 0;
        }
        .wp-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--bg3);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .wp-dot.filled {
            border-color: var(--aqua);
            background: var(--aqua);
            color: var(--bg);
        }
        .wp-dot.active {
            border-color: var(--yellow);
            box-shadow: 0 0 6px rgba(250,189,47,0.5);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 4px rgba(250,189,47,0.3); }
            50% { box-shadow: 0 0 10px rgba(250,189,47,0.7); }
        }

        /* Crew log entries */
        .crew-entry {
            display: flex;
            gap: 8px;
            padding: 3px 0;
            font-size: 11px;
            opacity: 0;
            transform: translateX(-8px);
            animation: slideIn 0.4s ease-out forwards;
        }
        .crew-entry .time { color: var(--fg-dim); min-width: 36px; }
        .crew-entry .icon { min-width: 14px; }
        .crew-entry .desc { color: var(--fg); }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        /* ── PROMPT BAR (bottom of feed) ── */
        .prompt-bar {
            border-top: 1px solid var(--bg2);
            padding: 8px 12px;
            background: var(--bg1);
            font-size: 12px;
            flex-shrink: 0;
            min-height: 36px;
            white-space: pre-wrap;
        }
        .prompt-prefix { color: var(--aqua); }
        .prompt-arrow { color: var(--fg-dim); }
        .prompt-text { color: var(--orange); }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .cursor-blink { animation: blink 0.8s infinite; color: var(--orange); }

        /* ── GOAL MET BANNER ── */
        .goal-banner {
            background: linear-gradient(90deg, rgba(250,189,47,0.15), rgba(142,192,124,0.15));
            border: 1px solid var(--yellow);
            padding: 8px 10px;
            text-align: center;
            font-size: 12px;
            color: var(--yellow);
            font-weight: bold;
            animation: goal-glow 2s infinite;
        }
        @keyframes goal-glow {
            0%, 100% { box-shadow: inset 0 0 8px rgba(250,189,47,0.1); }
            50% { box-shadow: inset 0 0 16px rgba(250,189,47,0.25); }
        }

        /* ── COMPASS WIDGET ── */
        .compass-widget {
            text-align: center;
            padding: 4px;
        }
        .compass-rose {
            font-size: 28px;
            display: block;
            margin: 2px 0;
            animation: spin-slow 20s linear infinite;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .bearing-text {
            font-size: 10px;
            color: var(--purple);
            font-style: italic;
        }

        /* ── XP TICKER ── */
        .xp-display {
            font-size: 22px;
            font-weight: bold;
            color: var(--yellow);
            text-align: center;
            padding: 4px 0;
            text-shadow: 0 0 12px rgba(250,189,47,0.3);
            transition: all 0.5s;
        }
        .xp-label {
            font-size: 10px;
            color: var(--fg-dim);
            text-align: center;
        }

        /* ── MULTIPLIER BADGE ── */
        .mult-badge {
            display: inline-block;
            background: var(--bg2);
            border: 1px solid var(--orange);
            border-radius: 3px;
            padding: 2px 8px;
            font-size: 11px;
            color: var(--orange);
            font-weight: bold;
        }

        /* ── BOTTOM CONTROLS ── */
        .controls {
            background: var(--bg1);
            border-top: 1px solid var(--bg2);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .ctrl-group { display: flex; gap: 6px; align-items: center; }
        .dot-group { display: flex; gap: 3px; }
        .nav-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--bg3);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-dot.active { background: var(--yellow); box-shadow: 0 0 4px rgba(250,189,47,0.4); }
        .nav-dot.past { background: var(--aqua); }
        #timeLabel { color: var(--aqua); min-width: 120px; text-align: center; }

        /* ── CRT OVERLAY ── */
        .crt {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.04),
                rgba(0,0,0,0.04) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* Feed entry colors */
        .f-org { color: var(--orange); }
        .f-aqu { color: var(--aqua); }
        .f-grn { color: var(--green); }
        .f-yel { color: var(--yellow); }
        .f-pur { color: var(--purple); }
        .f-red { color: var(--red); }
        .f-dim { color: var(--fg-dim); }
        .f-blu { color: var(--blue); }
    </style>
</head>

// ============================================
// ANIMATION HELPERS
// ============================================

function addLine(el, html, delay) {
    t(function() {
        var div = document.createElement('div');
        div.innerHTML = html || '&nbsp;';
        div.style.opacity = '0';
        div.style.transform = 'translateY(2px)';
        div.style.transition = 'opacity 0.25s, transform 0.25s';
        el.appendChild(div);
        // Trigger reflow then animate
        requestAnimationFrame(function() {
            div.style.opacity = '1';
            div.style.transform = 'translateY(0)';
        });
        el.scrollTop = el.scrollHeight;
    }, delay);
}

function typePrompt(pr, text, delay, speed, callback) {
    t(function() {
        pr.innerHTML = '<span class="prompt-prefix">odyssey</span> <span class="prompt-arrow">&#8250;</span> ';
        var chars = text.split('');
        chars.forEach(function(ch, i) {
            t(function() {
                // Escape HTML entities in the typed text
                var safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
                var current = pr.innerHTML.replace(/<span class="cursor-blink">.*?<\/span>/, '');
                pr.innerHTML = current + '<span class="prompt-text">' + safe + '</span>';
                if (i === chars.length - 1) {
                    pr.innerHTML += ' <span class="cursor-blink">&#9608;</span>';
                    if (callback) t(callback, 300);
                }
            }, i * speed);
        });
    }, delay);
}

// XP count-up
function animateXP(target) {
    var el = document.getElementById('xpDisplay');
    var current = parseInt(el.textContent.replace('+', '')) || 0;
    if (current === target) return;
    var steps = 30;
    var increment = (target - current) / steps;
    for (var i = 0; i <= steps; i++) {
        (function(val, step) {
            t(function() {
                el.textContent = '+' + Math.round(val);
            }, step * 30 + 500);
        })(current + (increment * i), i);
    }
}

// ============================================
// RENDER A SLIDE
// ============================================

var currentSlide = 0;
var autoAdvanceRunning = false;
var autoAdvanceTimer = null;

function renderSlide(n) {
    clearAll();
    if (n < 0 || n >= slideData.length) return;
    currentSlide = n;
    var data = slideData[n];

    // Update clock
    document.getElementById('clock').textContent = data.clock;

    // Update feed
    var feedBody = document.getElementById('feedBody');
    feedBody.innerHTML = '';
    var promptBar = document.getElementById('promptBar');
    promptBar.innerHTML = '<span class="prompt-prefix">odyssey</span> <span class="prompt-arrow">&#8250;</span> <span class="cursor-blink">&#9608;</span>';

    // Run feed animation
    data.feed(feedBody, promptBar);

    // Update sidebar
    // Ithaca bar
    t(function() {
        document.getElementById('ithacaBar').style.width = data.pct + '%';
        document.getElementById('ithacaPct').textContent = data.pct + '%';
        document.getElementById('ithacaEta').textContent = data.eta;
    }, 300);

    // XP
    animateXP(data.xp);

    // Waypoints
    for (var i = 0; i < 5; i++) {
        var dot = document.getElementById('wp' + i);
        dot.className = 'wp-dot';
        if (i < data.wp) {
            (function(d, idx) {
                t(function() { d.className = 'wp-dot filled'; }, 400 + idx * 200);
            })(dot, i);
        } else if (i === data.wp && data.wp < 5) {
            (function(d) {
                t(function() { d.className = 'wp-dot active'; }, 400 + data.wp * 200);
            })(dot);
        }
    }
    document.getElementById('wpCount').textContent = data.wp + ' / 5';

    // Bearing
    t(function() {
        document.getElementById('bearing').textContent = data.bearing;
    }, 600);

    // Crew log
    var crewLog = document.getElementById('crewLog');
    crewLog.innerHTML = '';
    data.crew.forEach(function(entry, idx) {
        t(function() {
            var div = document.createElement('div');
            div.className = 'crew-entry';
            div.style.animationDelay = (idx * 0.1) + 's';
            div.innerHTML = '<span class="time">' + entry.time + '</span><span class="icon ' + entry.color + '">' + entry.icon + '</span><span class="desc">' + entry.desc + '</span>';
            crewLog.appendChild(div);
        }, 500 + idx * 150);
    });

    // Goal banner
    var banner = document.getElementById('goalBanner');
    if (data.goalMet) {
        t(function() { banner.style.display = 'block'; }, 800);
    } else {
        banner.style.display = 'none';
    }

    updateDots();
    updateTimeLabel();
}

// ============================================
// NAVIGATION
// ============================================

function updateDots() {
    var dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    for (var i = 0; i < slideData.length; i++) {
        var dot = document.createElement('span');
        dot.className = 'nav-dot';
        if (i === currentSlide) dot.className += ' active';
        else if (i < currentSlide) dot.className += ' past';
        dot.style.cursor = 'pointer';
        (function(idx) { dot.onclick = function() { goToSlide(idx); }; })(i);
        dotsEl.appendChild(dot);
    }
}

function updateTimeLabel() {
    document.getElementById('timeLabel').textContent = slideData[currentSlide].time + ' \u00b7 ' + (currentSlide+1) + '/' + slideData.length;
}

function goToSlide(n) {
    renderSlide(n);
    if (autoAdvanceRunning) resetAutoAdvance();
    if (n === slideData.length - 1 && autoAdvanceRunning) stopAutoAdvance();
}

function nextSlide() {
    if (currentSlide < slideData.length - 1) goToSlide(currentSlide + 1);
}
function prevSlide() {
    if (currentSlide > 0) goToSlide(currentSlide - 1);
}

// Auto-advance (raw setTimeout)
function resetAutoAdvance() {
    clearTimeout(autoAdvanceTimer);
    if (autoAdvanceRunning && currentSlide < slideData.length - 1) {
        autoAdvanceTimer = setTimeout(nextSlide, 12000);
    }
}
function startAutoAdvance() {
    autoAdvanceRunning = true;
    document.getElementById('playBtn').innerHTML = '&#9208; Pause';
    resetAutoAdvance();
}
function stopAutoAdvance() {
    autoAdvanceRunning = false;
    clearTimeout(autoAdvanceTimer);
    document.getElementById('playBtn').innerHTML = '&#9654; Auto (12s)';
}
function toggleAutoAdvance() {
    if (autoAdvanceRunning) stopAutoAdvance();
    else startAutoAdvance();
}

// Event listeners
document.getElementById('prevBtn').addEventListener('click', prevSlide);
document.getElementById('nextBtn').addEventListener('click', nextSlide);
document.getElementById('playBtn').addEventListener('click', toggleAutoAdvance);
document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === ' ') { e.preventDefault(); toggleAutoAdvance(); }
});

// Initialize
goToSlide(0);
</script>
