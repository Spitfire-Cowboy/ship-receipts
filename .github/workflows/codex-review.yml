name: Codex PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    branches: [main]

jobs:
  review:
    # Use GitHub-hosted runner and trigger CodeRabbit retry
    # so a fresh review is produced on each PR event.
    runs-on: ubuntu-latest

    # Skip draft PRs and forks
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      contains(github.event.pull_request.labels.*.name, 'run-coderabbit')

    permissions:
      pull-requests: write

    steps:
      - name: Check for existing codex retry comment for this SHA
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! COMMENTS=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq '.[].body'); then
            echo "failed to enumerate issue comments; refusing to continue" >&2
            exit 1
          fi

          if grep -q "cr-codex-sha:$SHA" <<<"$COMMENTS"; then
            echo "already posted for $SHA — skipping" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry CodeRabbit review
        if: steps.dedup.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="@coderabbitai review <!-- cr-codex-sha:$SHA -->"
