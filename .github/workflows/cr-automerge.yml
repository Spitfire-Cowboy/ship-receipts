name: CR Auto-merge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
    branches: [main]

jobs:
  automerge:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'coderabbitai' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: cr-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check for actionable comments
        id: check
        env:
          BODY: ${{ github.event.review.body }}
        run: |
          # Match "Actionable comments posted: 0" with flexible whitespace/format.
          # Dependency: CodeRabbit review body format. Update regex if CR changes its output.
          if echo "$BODY" | grep -qE 'Actionable comments posted:[[:space:]]*0'; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "No actionable comments found — eligible for auto-merge"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "Actionable comments detected or pattern not matched — skipping auto-merge" >&2
          fi

      - name: Squash merge (REST with retry)
        id: merge
        if: steps.check.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merge_once() {
            gh api \
              --method PUT \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge" \
              -f merge_method='squash' \
              -f sha='${{ github.event.pull_request.head.sha }}'
          }

          if merge_once; then
            echo "mode=direct-rest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sleep 10
          if merge_once; then
            echo "mode=direct-rest-retry1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sleep 20
          merge_once
          echo "mode=direct-rest-retry2" >> "$GITHUB_OUTPUT"

  retry-cr-review:
    # On new commits, trigger a fresh CodeRabbit review automatically.
    # SHA-based deduplication prevents multiple retry comments for the same
    # commit, which would cause CodeRabbit to review repeatedly (infinite loop).
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: cr-retry-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check for existing retry comment for this SHA
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # REST call avoids GraphQL rate-limit pressure.
          if ! COMMENTS=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq '.[].body'); then
            echo "failed to enumerate issue comments; refusing to continue" >&2
            exit 1
          fi

          if grep -q "cr-retry-sha:$SHA" <<<"$COMMENTS"; then
            echo "already posted for $SHA — skipping" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CodeRabbit re-review
        if: steps.dedup.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="@coderabbitai review <!-- cr-retry-sha:$SHA -->"
