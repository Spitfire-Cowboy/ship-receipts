version: 1

# Paths/globs that are allowed in the publish-safe export tree.
# Keep this allowlist intentionally small and explicit.
include:
  - README.md
  - LICENSE
  - CHANGELOG.md
  - package.json
  - tsconfig.json
  - vitest.config.ts
  - src-ts/**
  - dist/**
  # Keep both for legacy/public schema directory naming.
  - schema/**
  - schemas/**
  - examples/**

# Tracked files that must exist in the export output.
required:
  - README.md
  - LICENSE
  - package.json
  - src-ts/cli.ts
