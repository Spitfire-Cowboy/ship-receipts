[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-receipts"
version = "0.1.0"
description = "Local scoring engine and proof-envelope exporter for ship receipts."
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ship-receipts = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
